<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Hopper</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            border: 4px solid #4f46e5;
            background-color: #70c5ce;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .back-link {
            margin-top: 15px;
            color: #818cf8;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <a href="../../index.html" class="back-link">&larr; Back to Arcade Hub</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let bird = { x: 80, y: 250, radius: 14, gravity: 0.5, lift: -8, velocity: 0 };
        let pipes = [];
        let frameCount = 0;
        let score = 0;
        let isGameOver = false;

        function spawnPipe() {
            let gap = 140;
            let topHeight = Math.floor(Math.random() * (canvas.height - gap - 150)) + 60;
            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - gap,
                width: 65,
                passed: false
            });
        }

        function resetGame() {
            bird.y = 250;
            bird.velocity = 0;
            pipes = [];
            frameCount = 0;
            score = 0;
            isGameOver = false;
            loop();
        }

        function handleInput() {
            if (isGameOver) {
                resetGame();
            } else {
                bird.velocity = bird.lift;
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") handleInput(); });
        canvas.addEventListener("click", handleInput);

        function update() {
            if (isGameOver) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
                isGameOver = true;
            }

            if (frameCount % 90 === 0) spawnPipe();

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 3.5;

                // Forgiving hitbox collision check
                if (
                    bird.x + bird.radius - 4 > pipes[i].x &&
                    bird.x - bird.radius + 4 < pipes[i].x + pipes[i].width &&
                    (bird.y - bird.radius + 4 < pipes[i].top || bird.y + bird.radius - 4 > canvas.height - pipes[i].bottom)
                ) {
                    isGameOver = true;
                }

                if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                    score++;
                    pipes[i].passed = true;
                }

                if (pipes[i].x + pipes[i].width < 0) {
                    pipes.splice(i, 1);
                }
            }
            frameCount++;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Pipes
            ctx.fillStyle = "#27ae60";
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
                // Pipe caps
                ctx.fillStyle = "#219653";
                ctx.fillRect(pipe.x - 4, pipe.top - 20, pipe.width + 8, 20);
                ctx.fillRect(pipe.x - 4, canvas.height - pipe.bottom, pipe.width + 8, 20);
                ctx.fillStyle = "#27ae60";
            });

            // Draw moving ground
            ctx.fillStyle = "#d35400";
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(0, canvas.height - 40, canvas.width, 10);

            // Draw Tilting Bird
            ctx.save();
            ctx.translate(bird.x, bird.y);
            let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity / 12)));
            ctx.rotate(rotation);

            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            // Eye
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(4, -4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(5, -4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Beak
            ctx.fillStyle = "#e67e22";
            ctx.beginPath();
            ctx.moveTo(bird.radius - 2, -2);
            ctx.lineTo(bird.radius + 6, 2);
            ctx.lineTo(bird.radius - 2, 6);
            ctx.fill();
            ctx.restore();

            // Score Display
            ctx.fillStyle = "white";
            ctx.font = "bold 36px sans-serif";
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 4;
            ctx.fillText(score, canvas.width / 2, 60);
            ctx.shadowBlur = 0;

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "white";
                ctx.font = "bold 32px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = "16px sans-serif";
                ctx.fillText("Click or Space to Restart", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
