<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Master</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            border: 4px solid #4f46e5;
            background-color: #111118;
            cursor: crosshair;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .back-link {
            margin-top: 15px;
            color: #818cf8;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <a href="../../index.html" class="back-link">&larr; Back to Arcade Hub</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let targets = [];
        let particles = [];
        let score = 0;
        let lives = 3;
        let isMouseDown = false;
        let trail = [];

        class Target {
            constructor() {
                this.x = Math.random() * (canvas.width - 120) + 60;
                this.y = canvas.height + 30;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = -(Math.random() * 4 + 10);
                this.radius = 24;
                this.isBomb = Math.random() < 0.15; // 15% chance to be a hazard bomb
                this.color = this.isBomb ? "#222" : `hsl(${Math.random() * 360}, 85%, 55%)`;
                this.sliced = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.35; // gravity
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                if (this.isBomb) {
                    ctx.strokeStyle = "#e74c3c";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = "white";
                    ctx.font = "14px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("💣", this.x, this.y + 5);
                }
                ctx.closePath();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
                this.color = color;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        window.addEventListener("mousedown", () => isMouseDown = true);
        window.addEventListener("mouseup", () => { isMouseDown = false; trail = []; });

        canvas.addEventListener("mousemove", (e) => {
            if (!isMouseDown || lives <= 0) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            trail.push({ x: mouseX, y: mouseY });
            if (trail.length > 8) trail.shift();

            targets.forEach(target => {
                if (!target.sliced) {
                    let dist = Math.hypot(target.x - mouseX, target.y - mouseY);
                    if (dist < target.radius + 5) {
                        target.sliced = true;
                        if (target.isBomb) {
                            lives = 0; // Hazard bomb hit ends game instantly
                        } else {
                            score++;
                            for (let p = 0; p < 8; p++) {
                                particles.push(new Particle(target.x, target.y, target.color));
                            }
                        }
                    }
                }
            });
        });

        function spawnLoop() {
            if (lives > 0) {
                targets.push(new Target());
                setTimeout(spawnLoop, Math.random() * 800 + 700);
            }
        }

        function update() {
            if (lives <= 0) return;

            for (let i = targets.length - 1; i >= 0; i--) {
                targets[i].update();
                if (targets[i].y > canvas.height + 60 && !targets[i].sliced) {
                    if (!targets[i].isBomb) lives--; // Missed normal target costs a life
                    targets.splice(i, 1);
                } else if (targets[i].sliced) {
                    targets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = "#111118";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            targets.forEach(target => target.draw());
            particles.forEach(particle => particle.draw());

            // Draw Swipe Trail Arc
            if (trail.length > 1) {
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 4;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.stroke();
            }

            // UI Text
            ctx.fillStyle = "white";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(`Score: ${score}`, 20, 30);
            ctx.fillText(`Lives: ${'❤️'.repeat(Math.max(0, lives))}`, canvas.width - 130, 30);

            if (lives <= 0) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        spawnLoop();
        loop();
    </script>
</body>
</html>
