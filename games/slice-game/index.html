<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Master</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            border: 4px solid #4f46e5;
            background-color: #111118;
            cursor: crosshair;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .back-link {
            margin-top: 15px;
            color: #818cf8;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <a href="../../index.html" class="back-link">&larr; Back to Arcade Hub</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let targets = [];
        let score = 0;
        let lives = 3;
        let isMouseDown = false;
        let trail = [];

        class Target {
            constructor() {
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = canvas.height + 30;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -(Math.random() * 5 + 9);
                this.radius = 25;
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                this.sliced = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3; // Gravity
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }
        }

        window.addEventListener("mousedown", () => isMouseDown = true);
        window.addEventListener("mouseup", () => {
            isMouseDown = false;
            trail = [];
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!isMouseDown) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            trail.push({ x: mouseX, y: mouseY, alpha: 1 });
            if (trail.length > 10) trail.shift();

            // Check collision with targets
            targets.forEach(target => {
                if (!target.sliced) {
                    let dist = Math.hypot(target.x - mouseX, target.y - mouseY);
                    if (dist < target.radius) {
                        target.sliced = true;
                        score++;
                    }
                }
            });
        });

        function spawnLoop() {
            if (lives > 0) {
                targets.push(new Target());
                setTimeout(spawnLoop, Math.random() * 1000 + 800);
            }
        }

        function update() {
            if (lives <= 0) return;

            for (let i = targets.length - 1; i >= 0; i--) {
                targets[i].update();

                // If target falls off screen without being sliced
                if (targets[i].y > canvas.height + 50 && !targets[i].sliced) {
                    lives--;
                    targets.splice(i, 1);
                } else if (targets[i].sliced) {
                    targets.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#111118";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            targets.forEach(target => target.draw());

            // Draw Swipe Trail
            if (trail.length > 1) {
                ctx.strokeStyle = "#ff4757";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.stroke();
            }

            // UI Text
            ctx.fillStyle = "white";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(`Score: ${score}`, 20, 30);
            ctx.fillText(`Lives: ${'❤️'.repeat(lives)}`, canvas.width - 130, 30);

            if (lives <= 0) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        spawnLoop();
        loop();
    </script>
</body>
</html>
